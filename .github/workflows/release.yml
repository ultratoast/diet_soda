name: Binary Builds and Releases

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RELEASE_TAG: ${{ inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}

defaults:
  run:
    shell: bash

jobs:
  verify:
    name: Verify source and tests
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    outputs:
      commit: ${{ steps.source.outputs.commit }}
      label: ${{ steps.source.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.84.1"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Validate build identity and pin source commit
        id: source
        run: |
          commit=$(git rev-parse HEAD)
          if [[ -n "$RELEASE_TAG" ]]; then
            python .github/scripts/package_release.py --tag "$RELEASE_TAG"
          else
            python .github/scripts/package_release.py --snapshot "$commit"
          fi
          printf 'commit=%s\n' "$commit" >> "$GITHUB_OUTPUT"
      - run: python -m unittest discover -s .github/scripts -p 'test_*.py'
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings

  build:
    name: Build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: macos-14
            target: aarch64-apple-darwin
    env:
      TARGET: ${{ matrix.target }}
      BUILD_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.84.1"
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target }}
      - run: cargo build --release --locked --target "$TARGET" --bin diet_soda
      - name: Smoke-test and package binary
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python .github/scripts/package_release.py --tag "$RELEASE_TAG" --target "$TARGET"
          else
            python .github/scripts/package_release.py --snapshot "$BUILD_COMMIT" --target "$TARGET"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.target }}
          path: target/dist/diet_soda-${{ needs.verify.outputs.label }}-${{ matrix.target }}.*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  bundle:
    name: Bundle archives and checksums
    needs: [verify, build]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    env:
      BUILD_COMMIT: ${{ needs.verify.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.verify.outputs.commit }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: target/dist
          merge-multiple: true
      - name: Generate checksums for the complete release
        run: |
          if [[ -n "$RELEASE_TAG" ]]; then
            python .github/scripts/package_release.py --tag "$RELEASE_TAG" --checksums
          else
            python .github/scripts/package_release.py --snapshot "$BUILD_COMMIT" --checksums
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: diet_soda-${{ needs.verify.outputs.label }}
          path: target/dist/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish GitHub Release
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    needs: [verify, bundle]
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: diet_soda-${{ needs.verify.outputs.label }}
          path: target/dist
      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          assets=(target/dist/*.tar.gz target/dist/*.zip target/dist/SHA256SUMS)
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            options=()
            if [[ "$RELEASE_TAG" == *-* ]]; then
              options+=(--prerelease)
            fi
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --generate-notes --title "$RELEASE_TAG" "${options[@]}"
          fi
